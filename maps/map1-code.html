<!DOCTYPE html>
<!-- THIS MAP IS MISLEADING: choropleth varies by population and not population density. I will fix this
 later on ArcGIS. -->
 
<!-- Code varies from lectures:
 * 472 - MapLibre - Filtering 2 - A way to highlight trees by taxa
 * 472 - MapLibre - Turf 7 - The user sets the distance
 Other sources are either mentioned here or in the README. -->

 <!-- =====================
 A. MAP INITIALISATION 
 ========================== -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Map 1: WORK IN PROGRESS: Dissemination Areas in Metro Vancouver coloured by population as reported in the 2021 Census</title>

    <!-- Load MapLibre's stylesheet (CSS). Its code (JavaScript) is loaded below, in the script. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"
    />
    <!-- Load Turf's code (JavaScript). After this line, the code on the page can use the name turf. -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.4.0/turf.min.js"></script>
  </head>
  <body>
  <!-- CSS for the appearance of the page -->
   <style>
    #map-container {
      display: flex;
      gap: 15px;
      align-items: flex-start;
    }
    #map {
      flex: 1;
      height: 600px;
    }
    #legend {
      width: 180px;
      padding: 12px;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-family: Arial, sans-serif;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .legend-colour {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      border: 1px solid #999;
      flex-shrink: 0;
    }
   </style>
    <!-- div container for web map: -->
    <div id="mapid" style="width: 800px; height: 500px;"></div>
    <!-- div container for map legend: -->
    <div id="legend"></div>
      <h3>Population, as reported in the 2021 Census</h3>
      <h4>The map uses the natural breaks classification method.</h4>
      <div class="legend-item">
        <span class="legend-colour" style="background: #feebe2"></span>
        Below 400 people
      </div>
      <div class="legend-item">
        <span class="legend-colour" style="background: #fbb4b9"></span>
        Between 401 and 484 people
      </div>
      <div class="legend-item">
        <span class="legend-colour" style="background: #f768a1"></span>
        Between 485 and 576 people
      </div>
      <div class="legend-item">
        <span class="legend-colour" style="background: #c51b8a"></span>
        Between 577 and 757 people
      </div>
      <div class="legend-item">
        <span class="legend-colour" style="background: #7a0177"></span>
        Between 758 to 29669 people
      </div>




    <script type="module">
    // Load MapLibre's code (JavaScript). Version 6 is loaded as a module, with import.
    import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';
    // Make a map with new maplibregl.Map(), and keep it in the variable map.
    const map = new maplibregl.Map({
        container: 'mapid',                  // the id of the div above
        center: [-123.1140, 49.2608],    // [longitude, latitude] of Vancouver City Hall
        zoom: 14,
        style: 'https://tiles.versatiles.org/assets/styles/colorful/style.json'   // free from https://makewithmaplibre.com/basemaps/styles/versatiles-colorful/
      });
    // A module keeps its names to itself. This line lets you type map in the console under the code.
    window.map = map;
    // url of raw data of Metro Van DAs from geos472-group-map GitHub repo:
    const url = 'https://raw.githubusercontent.com/michellechuqi/geos472-group-map/main/maps/zonal01.geojson';


// ========================== 
// B. STYLING 
// ==========================    
      // symbology for DAs: choropleth colours vary by population
    const DAsPaint = {
        'fill-color': ['step', ['get', 'population'], 
        // ranges below from Simply Analytics
        // colour scheme from https://colorbrewer2.org/#type=sequential&scheme=RdPu&n=5
        '#feebe2', // population below 3723: pale pink
        3724, '#fbb4b9', // pop of 3724 to 4607
        4608, '#f768a1', // pop of 4608 to 5446
        5447, '#c51b8a', // pop of 5447 to 6590
        6591, '#7a0177', // pop of 6591 to 29669: darkest pink
      ],
      'fill-opacity': 0.4,
      'fill-outline-color': '#000000' // black
    };

// ================================
// C. SOURCES AND LAYERS  
// ================================
    map.on('load', async function() { // map.on and async from Day 15 - Turf 7 lecture
        const response = await fetch(url);
        const DAs = await response.json();
        console.log(DAs.features.length + ' Dissemination Areas');

        map.addSource('DAs-source', {
            type: 'geojson',
            data: url,
            attribution: 'Dissemination Areas in Metro Vancouver, Simply Analytics'
        });
        map.addLayer({
            id: 'DAs-layer',
            type: 'fill',
            source: 'DAs-source',
            paint: DAsPaint
        });
    });

// ================================
// D. POPUPS  
// ================================

  // from Day 14 - Filtering 5 - A popup at the tree the mouse is over
  // I also referenced my work in Lab 2
  const hoverPopup = new maplibregl.Popup({closeButton: false});
  function hoverDA(event) {
    const DA = event.features[0].properties;
    hoverPopup.setLngLat(event.lngLat);
    hoverPopup.setHTML(
      `DA name and location: ${DA.NAME}<br>
       DA population: ${DA.population}`
      );
    hoverPopup.addTo(map);
  }
  function leaveDA() {
    hoverPopup.remove();
  }
  map.on('mousemove', 'DAs-layer', hoverDA);
  map.on('mouseleave', 'DAs-layer', leaveDA);


    </script>
  </body>
</html>
