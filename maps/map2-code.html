<!DOCTYPE html>
<!-- Code varies from lectures:
 * 472 - MapLibre - Filtering 2 - A way to highlight trees by taxa
 * 472 - MapLibre - Turf 7 - The user sets the distance
 Other sources are either mentioned here or in the README. -->

 <!-- =====================
 A. MAP INITIALISATION 
 ========================== -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Map 2: WORK IN PROGRESS</title>

    <!-- Load MapLibre's stylesheet (CSS). Its code (JavaScript) is loaded below, in the script. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"
    />
    <!-- Load Turf's code (JavaScript). After this line, the code on the page can use the name turf. -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.4.0/turf.min.js"></script>
  </head>
  <body>
    <!-- div element for web map: -->
    <div id="mapid" style="width: 800px; height: 500px;"></div>
    <!-- Buttons  -->
    <div id="controls" style="margin: 15px;">
      <button id="showAllDAsButton">Show All Dissemination Areas</button>
      <span style="display: inline-block; width: 30px;"></span>
      <label for="seaLevelNumberEntry">Enter projected sea level in metres: </label>
      <input type="number" id="seaLevelNumberEntry" placeholder="e.g. 1" step="1">
      <button id="highlightDAsButton">Highlight Affected Dissemination Areas</button>
    </div>

    <script type="module">
      // Load MapLibre's code (JavaScript). Version 6 is loaded as a module, with import.
    import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

    // Make a map with new maplibregl.Map(), and keep it in the variable map.
    const map = new maplibregl.Map({
        container: 'mapid',                  // the id of the div above
        center: [-123.1140, 49.2608],    // [longitude, latitude] of Vancouver City Hall
        zoom: 14,
        style: 'https://tiles.versatiles.org/assets/styles/colorful/style.json'   // free from https://makewithmaplibre.com/basemaps/styles/versatiles-colorful/
      });

    // A module keeps its names to itself. This line lets you type map in the console under the code.
    window.map = map;

    // url of raw data of Metro Van DAs from geos472-group-map GitHub repo:
    const url = 'https://raw.githubusercontent.com/michellechuqi/geos472-group-map/main/zonal01.geojson';

// ========================== 
// B. STYLING 
// ==========================    
      // symbology for DAs: choropleth colours vary by population
    const DAsPaint = {
        'fill-color': ['step', ['get', 'population'], 
        // ranges below from Simply Analytics
        // colour scheme from https://colorbrewer2.org/#type=sequential&scheme=RdPu&n=5
        '#feebe2', // population below 400: pale pink
        401, '#fbb4b9', // pop of 401 to 484
        485, '#f768a1', // pop of 485 to 576
        577, '#c51b8a', // pop of 577 to 757
        758, '#7a0177', // pop of 758 to 29669: darkest pink
      ],
      'fill-opacity': 0.4,
      'fill-outline-color': '#000000' // black
    };

// ================================
// C. ADDING SOURCES AND LAYERS I 
// ================================
    map.on('load', async function() { // map.on from Day 15-Turf 7 lecture
        const response = await fetch(url);
        const DAs = await response.json();
        console.log(DAs.features.length + ' Dissemination Areas');

        map.addSource('DAs-source', {
            type: 'geojson',
            data: url,
            attribution: 'Dissemination Areas in Metro Vancouver, Simply Analytics'
        });
        map.addLayer({
            id: 'DAs-layer',
            type: 'fill',
            source: 'DAs-source',
            paint: DAsPaint
        });
    });

// ==========================
// D. HIGHLIGHT DAs BUTTON
// ==========================  
    function showAllDAs() {
        addDAs();
        map.setFilter('DAs-layer', null);
    }

    function addDAs() {
        if (map.getSource('DAs-source')){
            return;
        }
    }
    function highlightDAs() {
        addDAs();
        const seaLevelEntry = document.getElementById('seaLevelNumberEntry');
        const DAsToHighlight = seaLevelEntry.value;
        if (DAsToHighlight === '') {
            showAllDAs();
            return;
        } // else
        map.setFilter('DAs-layer', ['<=', ['get', 'elevation'], DAsToHighlight]);
    }
    map.on('load', function() {
      const showAllButton = document.getElementById('showAllDAsButton');
      showAllButton.addEventListener('click', showAllDAs);
      const highlightButton = document.getElementById('highlightDAsButton');
      highlightButton.addEventListener('click', highlightDAs);
    });
    
      

    </script>
  </body>
</html>
