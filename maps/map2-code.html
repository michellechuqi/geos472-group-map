<!DOCTYPE html>
<!-- Code varies from lectures:
 * 472 - MapLibre - Filtering 2 - A way to highlight trees by taxa
 * 472 - MapLibre - Turf 7 - The user sets the distance
 Other sources are either mentioned here or in the README. -->

 <!-- =====================
 A. MAP INITIALISATION 
 ========================== -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Map 2: Visualisation of elevation across Metro Vancouver</title>

    <!-- Load MapLibre's stylesheet (CSS). Its code (JavaScript) is loaded below, in the script. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"
    />
    <!-- Loading PMTiles -->
     <script src="https://unpkg.com/pmtiles@latest/dist/pmtiles.js"></script> 
  </head>
  <body>
    <!-- div element for web map: -->
    <div id="mapid" style="width: 800px; height: 500px;"></div>
    <!-- Buttons  
    Flexbox from lab 2: https://github.com/michellechuqi/michellechuqi-web/blob/main/lab2/lab2-map.html-->

    <div id="buttons" style=" 
        width: 800px;
        margin: 15px 0;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        ">
        <button id="showAllDAsButton">Show All DAs</button>
        <button id="showDEMButton">Show DEM</button>
        <p>Projected sea level rise:
          <span id="seaLevelValue">0 meters</span>
          <input id="seaLevelSlider" type="range" min="0" max="2" step="0.1" value="0">
        </p>
        <p><span id="affectedCount">0</span> people affected</p>
    </div>

    <script type="module">
      // Load MapLibre's code (JavaScript). Version 6 is loaded as a module, with import.
    import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

    // Make a map with new maplibregl.Map(), and keep it in the variable map.
    const map = new maplibregl.Map({
        container: 'mapid',                  // the id of the div above
        center: [-123.1140, 49.2608],    // [longitude, latitude] of Vancouver City Hall
        zoom: 14,
        style: 'https://tiles.versatiles.org/assets/styles/colorful/style.json'   // free from https://makewithmaplibre.com/basemaps/styles/versatiles-colorful/
      });

    // A module keeps its names to itself. This line lets you type map in the console under the code.
    window.map = map;

    // url of raw data of Metro Van DAs from geos472-group-map GitHub repo:
    const url = 'https://raw.githubusercontent.com/michellechuqi/geos472-group-map/main/DAs_nov21.geojson';

// ========================== 
// B. STYLING 
// ==========================    
    // symbology for DAs: choropleth colours vary by population
    const elevationPaint = {
      'fill-color': [
        'case', 
        ['==', ['get', 'elevation'], 255], '#bdbdbd', // for DAs with specific elevation of 255

        ['step', ['get', 'elevation'], 
          // ranges below from R (see documentation)
          // colour scheme from https://colorbrewer2.org/#type=sequential&scheme=RdPu&n=5
          '#ffffd4', // population 0 to 30: pale orange
          31, '#fed98e', // pop of 31 to 69
          70, '#fe9929', // pop of 70 to 112
          123, '#d95f0e', // pop of 123 to 187
          188, '#993404', // pop of 188 to 247: darkest orange
          ]
      ],
      'fill-opacity': 0.6,
      'fill-outline-color': '#000000' // black
    };

// ================================
// C. ADDING SOURCES AND LAYERS I 
// ================================
  map.on('load', async function() { // map.on from Day 15-Turf 7 lecture
      const response = await fetch(url);
      const DAs = await response.json();
      console.log(DAs.features.length + ' Dissemination Areas');

      map.addSource('DAs-source', {
          type: 'geojson',
          data: url,
          attribution: 'Dissemination Areas in Metro Vancouver, Simply Analytics'
      });
      map.addLayer({
          id: 'DAs-layer',
          type: 'fill',
          source: 'DAs-source',
          paint: elevationPaint
      });
  });

// ================================
// D. POPUPS  
// ================================
  // from Day 14 - Filtering 5 - A popup at the tree the mouse is over
  // I also referenced my work in Lab 2
  const hoverPopup = new maplibregl.Popup({closeButton: false});
  function hoverDA(event) {
    const DA = event.features[0].properties;
    hoverPopup.setLngLat(event.lngLat);
    hoverPopup.setHTML(
      `DA name and location: ${DA.NAME}<br>
       DA elevation: ${DA.elevation}`
      );
    hoverPopup.addTo(map);
  }
  function leaveDA() {
    hoverPopup.remove();
  }
  map.on('mousemove', 'DAs-layer', hoverDA);
  map.on('mouseleave', 'DAs-layer', leaveDA);


// to-organise:
// URL of the PMTiles file
const DEMpmtilesURL = 'https://raw.githubusercontent.com/michellechuqi/geos472-group-map/main/for-DEM/fromCombinedDEM.pmtiles';

// Register PMTiles protocol
let protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

// Add DEM after map has loaded
map.on('load', function() {

  map.addSource('dem-background', {
    type: 'raster',
    url: `pmtiles://${DEMpmtilesURL}`,
    tileSize: 256
  });

  map.addLayer({
    id: 'dem-background-layer',
    type: 'raster',
    source: 'dem-background'
  });

});

    </script>
  </body>
</html>
